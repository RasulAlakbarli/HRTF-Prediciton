<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="The loss weights frequency bins inversely to critical bandwidth and scores only the plus or minus 30 degree elevation band.">
  <defs>
    <clipPath id="sph"><circle cx="800" cy="170" r="95"/></clipPath>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- ================= (a) weighting curve ================= -->
  <text x="350" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Weight per frequency bin</text>

  <!-- axes -->
  <line x1="90" y1="250" x2="622" y2="250" stroke="#374151" stroke-width="2.2"/>
  <line x1="90" y1="250" x2="90" y2="52" stroke="#374151" stroke-width="2.2"/>

  <!-- filled curve -->
  <polygon fill="#DBEAFE" stroke="none" points="90,250 90.0,60.0 98.1,77.1 106.2,111.3 114.4,142.4 122.5,165.6 130.6,182.4 138.8,194.5 146.9,203.5 155.0,210.3 163.1,215.7 171.2,219.9 179.4,223.3 187.5,226.2 195.6,228.5 203.8,230.5 211.9,232.2 220.0,233.6 228.1,234.9 236.2,236.0 244.4,237.0 252.5,237.9 260.6,238.6 268.8,239.3 276.9,239.9 285.0,240.5 293.1,241.0 301.2,241.5 309.4,241.9 325.6,242.6 341.9,243.3 358.1,243.8 374.4,244.3 390.6,244.7 406.9,245.1 423.1,245.4 439.4,245.7 455.6,246.0 471.9,246.2 488.1,246.4 504.4,246.6 520.6,246.8 536.9,246.9 553.1,247.1 569.4,247.2 585.6,247.3 601.9,247.5 610.0,247.5 610,250"/>
  <polyline fill="none" stroke="#2563EB" stroke-width="3.5" points="90.0,60.0 98.1,77.1 106.2,111.3 114.4,142.4 122.5,165.6 130.6,182.4 138.8,194.5 146.9,203.5 155.0,210.3 163.1,215.7 171.2,219.9 179.4,223.3 187.5,226.2 195.6,228.5 203.8,230.5 211.9,232.2 220.0,233.6 228.1,234.9 236.2,236.0 244.4,237.0 252.5,237.9 260.6,238.6 268.8,239.3 276.9,239.9 285.0,240.5 293.1,241.0 301.2,241.5 309.4,241.9 325.6,242.6 341.9,243.3 358.1,243.8 374.4,244.3 390.6,244.7 406.9,245.1 423.1,245.4 439.4,245.7 455.6,246.0 471.9,246.2 488.1,246.4 504.4,246.6 520.6,246.8 536.9,246.9 553.1,247.1 569.4,247.2 585.6,247.3 601.9,247.5 610.0,247.5"/>

  <!-- x ticks -->
  <g stroke="#374151" stroke-width="2">
    <line x1="90" y1="250" x2="90" y2="258"/><line x1="220" y1="250" x2="220" y2="258"/>
    <line x1="350" y1="250" x2="350" y2="258"/><line x1="480" y1="250" x2="480" y2="258"/>
    <line x1="610" y1="250" x2="610" y2="258"/>
  </g>
  <g font-size="15" fill="#374151" text-anchor="middle">
    <text x="90" y="280">0</text><text x="220" y="280">6</text><text x="350" y="280">12</text>
    <text x="480" y="280">18</text><text x="610" y="280">24</text>
  </g>
  <text x="350" y="308" font-size="16" fill="#374151" text-anchor="middle">frequency (kHz)</text>

  <!-- callout: mass concentration -->
  <line x1="177" y1="250" x2="177" y2="96" stroke="#DC2626" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="192" y="92" font-size="16" font-weight="700" fill="#DC2626">74% of the weight below 5 kHz</text>
  <text x="192" y="116" font-size="15" fill="#991B1B">only 13% in the 5–10 kHz pinna-notch band</text>

  <!-- ================= (b) elevation band ================= -->
  <text x="800" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Scored region</text>

  <circle cx="800" cy="170" r="95" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <rect x="705" y="122" width="190" height="96" fill="#86EFAC" opacity="0.55" clip-path="url(#sph)"/>
  <ellipse cx="800" cy="122" rx="84" ry="17" fill="none" stroke="#16A34A" stroke-width="2.5" clip-path="url(#sph)"/>
  <ellipse cx="800" cy="218" rx="84" ry="17" fill="none" stroke="#16A34A" stroke-width="2.5" clip-path="url(#sph)"/>
  <ellipse cx="800" cy="170" rx="95" ry="24" fill="none" stroke="#A78BFA" stroke-width="1.8"/>
  <circle cx="800" cy="170" r="17" fill="#EDE9FE" stroke="#4C1D95" stroke-width="2.5"/>
  <text x="906" y="128" font-size="16" font-weight="700" fill="#166534">+30°</text>
  <text x="906" y="228" font-size="16" font-weight="700" fill="#166534">−30°</text>
  <text x="800" y="298" font-size="16" fill="#166534" text-anchor="middle">elevations ±30° only</text>
</svg>
