<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="A few grayscale ear photos go into one network and come out as a full-sphere personalized HRTF.">
  <defs>
    <marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L9 5 L0 9 z" fill="#1F2937"/>
    </marker>
  </defs>
  <rect width="960" height="330" fill="#ffffff"/>

  <!-- ============ (a) INPUT ============ -->
  <text x="150" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">A few ear photos</text>

  <!-- photo stack -->
  <rect x="72" y="72" width="132" height="132" rx="12" fill="#F3F4F6" stroke="#9CA3AF" stroke-width="2"/>
  <rect x="60" y="84" width="132" height="132" rx="12" fill="#E9EBEF" stroke="#6B7280" stroke-width="2"/>
  <rect x="48" y="96" width="132" height="132" rx="12" fill="#DFE3E8" stroke="#374151" stroke-width="2.5"/>
  <path d="M92 126 C133 112, 158 143, 151 178 C146 204, 126 217, 108 229 C93 239, 76 231, 73 213
           M104 148 C126 144, 137 164, 131 185 C127 201, 114 208, 104 213"
        fill="none" stroke="#1F2937" stroke-width="4.5" stroke-linecap="round"/>

  <text x="150" y="264" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle">19, 7 or 3 views/ear</text>
  <text x="150" y="292" font-size="15" fill="#6B7280" text-anchor="middle">grayscale, 256×256</text>

  <!-- ============ arrow ============ -->
  <line x1="228" y1="160" x2="316" y2="160" stroke="#1F2937" stroke-width="3" marker-end="url(#a1)"/>

  <!-- ============ (b) MODEL ============ -->
  <text x="480" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">One network</text>

  <rect x="330" y="72" width="300" height="156" rx="16" fill="#EFF6FF" stroke="#2563EB" stroke-width="3"/>
  <rect x="352" y="104" width="80" height="60" rx="10" fill="#DBEAFE" stroke="#2563EB" stroke-width="2"/>
  <text x="392" y="140" font-size="16" font-weight="700" fill="#1E3A8A" text-anchor="middle">CNN</text>
  <line x1="436" y1="134" x2="452" y2="134" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a1)"/>
  <rect x="456" y="104" width="88" height="60" rx="10" fill="#DCFCE7" stroke="#16A34A" stroke-width="2"/>
  <text x="500" y="140" font-size="16" font-weight="700" fill="#14532D" text-anchor="middle">BiLSTM</text>
  <line x1="548" y1="134" x2="564" y2="134" stroke="#1F2937" stroke-width="2.5" marker-end="url(#a1)"/>
  <rect x="568" y="104" width="46" height="60" rx="10" fill="#FEF3C7" stroke="#D97706" stroke-width="2"/>
  <text x="591" y="140" font-size="16" font-weight="700" fill="#78350F" text-anchor="middle">LSTM</text>
  <text x="480" y="196" font-size="15" fill="#1E40AF" text-anchor="middle">any number of views → one code</text>

  <text x="480" y="264" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle">no 3-D scan, no simulation</text>
  <text x="480" y="292" font-size="15" fill="#6B7280" text-anchor="middle">a single forward pass</text>

  <!-- ============ arrow ============ -->
  <line x1="654" y1="160" x2="742" y2="160" stroke="#1F2937" stroke-width="3" marker-end="url(#a1)"/>

  <!-- ============ (c) OUTPUT ============ -->
  <text x="850" y="34" font-size="19" font-weight="700" fill="#111827" text-anchor="middle">Personalized HRTF</text>

  <circle cx="850" cy="150" r="78" fill="#F5F3FF" stroke="#7C3AED" stroke-width="3"/>
  <ellipse cx="850" cy="150" rx="78" ry="26" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <ellipse cx="850" cy="150" rx="30" ry="78" fill="none" stroke="#A78BFA" stroke-width="2"/>
  <ellipse cx="850" cy="120" rx="70" ry="20" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
  <ellipse cx="850" cy="182" rx="68" ry="19" fill="none" stroke="#C4B5FD" stroke-width="1.6"/>
  <g fill="#6D28D9">
    <circle cx="850" cy="72" r="4"/><circle cx="800" cy="104" r="4"/><circle cx="900" cy="104" r="4"/>
    <circle cx="772" cy="150" r="4"/><circle cx="928" cy="150" r="4"/><circle cx="806" cy="196" r="4"/>
    <circle cx="894" cy="196" r="4"/><circle cx="850" cy="228" r="4"/><circle cx="820" cy="140" r="4"/>
    <circle cx="880" cy="140" r="4"/>
  </g>
  <circle cx="850" cy="150" r="16" fill="#EDE9FE" stroke="#4C1D95" stroke-width="2.5"/>

  <text x="850" y="264" font-size="17" font-weight="600" fill="#1F2937" text-anchor="middle">793 directions × 2 ears</text>
  <text x="850" y="292" font-size="15" fill="#6B7280" text-anchor="middle">exported as SOFA</text>
</svg>
